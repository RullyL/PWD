<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Demo</title>
    <style>
        table {
            border-collapse: collapse;
            width: 20%;
        }

        td {
            text-align: center;
        }
    </style>
</head>

<body>
    <table border="1">
        <thead>
            <tr>
                <th>No.</th>
                <th>Full Name</th>
                <th>Position</th>
                <th>Salary</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>John Anderson</td>
                <td>Manager</td>
                <td>$1000</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Anderson John</td>
                <td>Developer</td>
                <td>$1000</td>
            </tr>
            <tr>
                <td>3</td>
                <td> Maru</td>
                <td>Manager</td>
                <td>$1000</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Uram</td>
                <td>Ob</td>
                <td>$1000</td>
            </tr>
        </tbody>

    </table>
</body>

</html>
